# Issue #14: copia de seguridad del despliegue y su restauración. La contraseña de abajo es de un
# archivo y nunca de una cuenta — véase ADR-0006, que es la razón por la que a una copia que
# restaura en cualquier equipo no le queda nada más que la proteja.
administration.backup = Copia de seguridad
administration.backup-file = /ruta/absoluta/copia.jflb
administration.backup-password = Contraseña del archivo
administration.export-backup = Exportar copia
administration.import-backup = Restaurar copia
administration.confirm-import = Restaurar y borrar todo lo de aquí
administration.cancel-import = Cancelar
administration.backup-explanation = Contiene las cuentas y la configuración, cifradas con la contraseña que escribas aquí, y se restaura en cualquier equipo. No el almacén de secretos, ni el registro de eventos, ni una inscripción en curso. Guarda la contraseña aparte: nadie puede recuperarla por ti.
administration.backup-file-needed = Escribe la ruta completa del archivo de copia.
administration.backup-password-needed = Escribe la contraseña con la que se cifra la copia.
administration.backup-exported = Copia escrita en {2}: {0} cuentas y {1} ajustes. Guarda bien la contraseña.
administration.import-consequences = Restaurar «{0}» elimina todas las cuentas y ajustes de este equipo y pone en su lugar los de ese archivo. No se fusiona nada, no se puede deshacer y se cerrará tu sesión.
administration.backup-imported = Se ha restaurado la copia. Entra con las credenciales del despliegue del que procede.
refused.backup-destination-refused = El servicio no va a escribir ahí. Elige una ruta absoluta, en una carpeta que ya exista, que no sea la suya y donde no haya ya un archivo.
refused.backup-source-refused = El servicio no va a leer de ahí. Elige una ruta absoluta a un archivo que exista y que no esté dentro de la carpeta del propio servicio.
refused.backup-not-read = Esa copia no se ha abierto: la contraseña es incorrecta, el archivo está dañado o no es una copia. No se ha cambiado nada en este equipo.
refused.backup-not-this-schema = Esa copia la escribió otra versión de este producto y esta no puede restaurarla. No se ha cambiado nada en este equipo.
refused.backup-has-no-administrator = Esa copia no contiene ninguna cuenta de administración, así que restaurarla dejaría el despliegue sin nadie que pudiera gestionarlo. No se ha cambiado nada.
refused.backup-failed = No se ha podido escribir la copia ni restaurarla. No queda nada escrito a medias y no se ha cambiado nada en este equipo.
