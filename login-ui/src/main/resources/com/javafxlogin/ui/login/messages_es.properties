# La interfaz en español, que es la lengua en la que se lee este producto donde se instala.
#
# Cada clave dice lo mismo que en messages.properties, que es el catálogo al que responde cualquier
# bundle: una clave que falte aquí se lee de allí, y por eso los tests exigen que las dos listas
# coincidan — un idioma a medias es una pantalla en dos idiomas.
#
# Un mensaje con {0} lo lee java.text.MessageFormat, que trata la comilla simple como comilla:
# escribe '' donde ese mensaje necesite una. Los mensajes sin argumentos se usan tal cual.

# Las ventanas, tanto el título del stage como el encabezado de dentro.
login.title = Iniciar sesión
first-run.title = Primer arranque
enrolment.title = Establecer contraseña
administration.title = Administración
feature.title = Funcionalidad protegida

# La pantalla de acceso.
login.account-name = Nombre de cuenta
login.password = Contraseña
login.administer = Entrar en la administración
login.admit = Acceder
login.enrol-instead = Tengo un código de un solo uso
login.language = Idioma
login.refused = No se ha podido iniciar sesión. Revisa el nombre de cuenta y la contraseña.
login.session-already-live = Ya hay una sesión abierta en este equipo. Ciérrala antes de iniciar otra.

# El asistente de primera ejecución.
first-run.explanation = Esta aplicación no trae ninguna cuenta creada. Crea aquí la cuenta de administración: es la única que podrá crear después las cuentas de operación.
first-run.recovery-warning = Esta contraseña no se puede recuperar. No hay clave de recuperación, ni código de respaldo, ni forma de restablecerla, y nunca la habrá: si la pierdes, pierdes el acceso a esta instalación. Guárdala en un gestor de contraseñas antes de continuar.
first-run.account-name = Nombre de cuenta
first-run.password = Contraseña
first-run.create = Crear la cuenta de administración
first-run.administrator-exists = Esta instalación ya tiene su cuenta de administración. Reinicia la aplicación para acceder.
first-run.not-machine-administrator = Solo puede crear esta cuenta quien administre el equipo. Cierra la aplicación y vuelve a abrirla desde una cuenta del sistema con permisos de administración.

# La pantalla de alta.
enrolment.explanation = Esta cuenta todavía no tiene contraseña. Escribe el código de un solo uso que te han dado y elige tu contraseña: nadie más la conocerá, ni siquiera quien administre la aplicación.
enrolment.recovery-warning = Esta contraseña no se puede recuperar. Si la pierdes, tendrán que darte otro código para volver a establecerla. Guárdala en un gestor de contraseñas antes de continuar.
enrolment.account-name = Nombre de cuenta
enrolment.secret = Código de un solo uso
enrolment.password = Contraseña
enrolment.repeated-password = Repite la contraseña
enrolment.enrol = Establecer la contraseña
enrolment.refused = El código no es válido, ya se ha usado o ha caducado. Pide uno nuevo a quien administre la aplicación.
enrolment.passwords-do-not-match = Las dos contraseñas no coinciden. Escríbelas otra vez.
enrolment.enrolled = Ya puedes iniciar sesión con la contraseña que acabas de elegir.

# La ventana en la que trabaja un operador con acceso.
session.log-out = Cerrar sesión
session.notice-read = Entendido
session.password-was-reset = Tu contraseña fue restablecida por la administración el {0}. Si no lo habías pedido, comunícalo.
session.ended.logged-out = Has cerrado la sesión.
session.ended.service-lost = Se ha perdido la conexión con el servicio de autenticación, así que la sesión ha terminado.
session.ended.inactivity = Tu sesión se ha cerrado tras un rato sin actividad. Vuelve a acceder para continuar.
session.ended.clock-jumped = Tu sesión se ha cerrado porque la hora del equipo ha cambiado, o porque el equipo ha estado suspendido.
session.ended.no-such-session = Tu sesión ya no está activa. Vuelve a acceder para continuar.

# Lo que no es una respuesta: un servicio inalcanzable y un fallo que no ha contestado nada.
service.unreachable = No se ha podido contactar con el servicio de autenticación.
service.unanswered = No se ha podido completar el intento. Vuelve a intentarlo.

# El bloqueo, dicho igual en cualquier pantalla donde alguien se lo encuentre.
lockout.refused = La cuenta está bloqueada temporalmente tras varios intentos fallidos. Vuelve a intentarlo dentro de {0}.
lockout.wait = {0,choice,1#1 minuto|1<{0} minutos}

