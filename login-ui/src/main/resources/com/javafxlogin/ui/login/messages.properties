# The interface in English, and the wording every other bundle answers to.
#
# This is the base bundle: a machine whose locale names a language this build ships no wording for
# is drawn from here, so it is the one file that must never be missing a key. Adding a language is a
# messages_<tag>.properties beside this one and its tag in languages.properties; no class here names
# a language, and the AuthenticationService names none either.
#
# A message with {0} in it is read by java.text.MessageFormat, which treats a single quote as
# quoting: write '' where such a message needs an apostrophe. Messages without arguments are used as
# they are written, apostrophes and all.
#
# Nothing here is assembled from fragments. Where a sentence changes with a number, the choice is in
# the message rather than in the code that formats it, so that a language whose plural rules differ
# is a matter of editing this file.

