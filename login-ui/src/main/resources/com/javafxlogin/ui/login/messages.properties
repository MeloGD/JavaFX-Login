refused.export-failed = The record could not be copied. Nothing has been left half-written at the destination.

# Issue #14: backing the deployment up, and restoring it. The password below is a file's and never
# an Account's — see ADR-0006, which is why a backup that restores anywhere has nothing else left
# protecting it.
administration.backup = Backup
administration.backup-file = /absolute/path/backup.jflb
administration.backup-password = Password for the file
administration.export-backup = Export a backup
administration.import-backup = Restore a backup
administration.confirm-import = Restore and delete everything here
administration.cancel-import = Cancel
administration.backup-explanation = Holds the accounts and the configuration, encrypted under the password typed here, and restores on any machine. Not the secret vault, the event record, or an enrolment in progress. Keep the password elsewhere: nobody can recover it for you.
administration.backup-file-needed = Type the full path of the backup file.
administration.backup-password-needed = Type the password the backup is encrypted under.
administration.backup-exported = Backup written to {2}: {0} accounts and {1} settings. Keep the password safe.
administration.import-consequences = Restoring «{0}» deletes every account and setting on this machine and puts that file''s in their place. Nothing is merged, nothing can be undone, and you will be signed out.
administration.backup-imported = The backup has been restored. Sign in with the credentials of the deployment that backup came from.
refused.backup-destination-refused = The service will not write there. Choose an absolute path, in a folder that already exists, that is not its own and where there is no file already.
refused.backup-source-refused = The service will not read from there. Choose an absolute path to an existing file that is not inside the service's own folder.
refused.backup-not-read = That backup did not open: the password is wrong, the file has been damaged, or it is not a backup. Nothing on this machine has been changed.
refused.backup-not-this-schema = That backup was written by another version of this product and cannot be restored by this one. Nothing on this machine has been changed.
refused.backup-has-no-administrator = That backup holds no administration account, so restoring it would leave nobody able to manage this deployment. Nothing has been changed.
refused.backup-failed = The backup could not be written or could not be restored. Nothing has been left half-written and nothing on this machine has been changed.
