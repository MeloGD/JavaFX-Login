# The first-run wizard.
first-run.explanation = This application ships with no account. Create the administration account here: it is the only one that can create the accounts people work with.
first-run.recovery-warning = This password cannot be recovered. There is no recovery key, no backup code and no way to reset it, and there never will be: lose it and you lose access to this installation. Save it in a password manager before continuing.
first-run.account-name = Account name
first-run.password = Password
first-run.create = Create the administration account
first-run.administrator-exists = This installation already has its administration account. Restart the application to sign in.
first-run.not-machine-administrator = Only whoever administers this machine can create this account. Close the application and open it again from a system account with administrative rights.

# The enrolment screen.
enrolment.explanation = This account has no password yet. Type the one-time code you were given and choose your password: nobody else will ever know it, not even whoever administers the application.
