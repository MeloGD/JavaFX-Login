enrolment.password = Password
enrolment.repeated-password = Repeat the password
enrolment.enrol = Set the password
enrolment.refused = That code is not valid, has already been used or has expired. Ask whoever administers the application for a new one.
enrolment.passwords-do-not-match = The two passwords do not match. Type them again.
enrolment.enrolled = You can now sign in with the password you have just chosen.

