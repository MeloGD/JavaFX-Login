# The languages this build offers, as IETF BCP 47 tags, in the order the selector lists them.
#
# It is a file of its own rather than a key inside the wording, because it is a fact about the build
# and not about any one language: a copy of it in every bundle would be a list that could come to
# disagree with itself, and the login screen would offer a language depending on which one it was
# already showing.
#
# Adding a language is this line and a messages_<tag>.properties beside it. Nothing in the code
# names a language, and nothing in the AuthenticationService does either — the store keeps whatever
# tag it is given, so a build that ships one more bundle needs no migration and no restart of the
# privileged process.
#
# The first tag is what a machine whose locale this build has no wording for is shown, and it is
# what messages.properties holds.
offered = en, es
